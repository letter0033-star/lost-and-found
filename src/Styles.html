<style>
  :root {
    --bg: #F6F3EC;
    --surface: #FFFFFF;
    --surface-2: #FBFAF6;
    --ink: #1D2926;
    --muted: #5E6A66;
    --faint: #8B9591;
    --line: #E5DFD3;
    --brand: #1E6B52;
    --brand-strong: #155440;
    --brand-soft: #E2F0E9;
    --accent: #F0AE34;
    --accent-soft: #FDF0D3;
    --accent-ink: #7A4E00;
    --danger: #BF3D2B;
    --danger-soft: #FBE6E2;
    --info: #2C64A8;
    --info-soft: #E3EDF9;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(30, 40, 35, .06), 0 4px 14px rgba(30, 40, 35, .06);
    --shadow-lg: 0 10px 40px rgba(20, 30, 25, .22);
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 13.5px; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* 상단 바 */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.3px; }
  .brand svg { flex: none; }
  .brand small { display: block; font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: 0; }
  .topbar .spacer { flex: 1; }

  /* 버튼 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 42px; padding: 0 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer;
    font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: var(--surface-2); border-color: #D4CCBC; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #3B2600; }
  .btn-accent:hover { background: #E59F1F; border-color: #E59F1F; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-danger:hover { background: #A33221; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: rgba(0,0,0,.04); border-color: transparent; }
  .btn-sm { min-height: 34px; padding: 0 11px; font-size: 13.5px; }
  .btn-lg { min-height: 52px; padding: 0 22px; font-size: 17px; border-radius: 12px; }
  .btn-block { width: 100%; }

  /* 입력 */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label, .field > .label { font-weight: 700; font-size: 14.5px; }
  .field .req { color: var(--danger); margin-left: 2px; }
  .field .hint { font-size: 13px; color: var(--muted); }
  .input, .select, .textarea {
    width: 100%; min-height: 44px; padding: 9px 12px; border-radius: var(--radius-sm);
    border: 1px solid #D8D1C3; background: #fff; outline: none;
  }
  .textarea { min-height: 88px; resize: vertical; }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(30,107,82,.15); }
  .input-icon { position: relative; }
  .input-icon svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .input-icon .input { padding-left: 40px; }
  .seg { display: inline-flex; border: 1px solid #D8D1C3; border-radius: var(--radius-sm); overflow: hidden; background: #fff; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: inline-flex; align-items: center; min-height: 42px; padding: 0 18px; cursor: pointer; font-weight: 700; color: var(--muted); }
  .seg label + label span { border-left: 1px solid #D8D1C3; }
  .seg input:checked + span { background: var(--brand); color: #fff; }
  .seg input:focus-visible + span { outline: 3px solid rgba(30,107,82,.3); outline-offset: -3px; }

  /* 배지 */
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .b-keep { background: var(--brand-soft); color: var(--brand-strong); }
  .b-long { background: var(--accent-soft); color: var(--accent-ink); }
  .b-returned { background: var(--info-soft); color: var(--info); }
  .b-disposed { background: #ECEAE5; color: #5B5852; }
  .b-public { background: #EAF6EE; color: #1F7A45; }
  .b-private { background: var(--danger-soft); color: var(--danger); }
  .b-cat { background: #F0EDE6; color: #57524A; }

  /* 카드/패널 */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel-pad { padding: 20px; }
  .panel h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: -.3px; }
  .notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 14px; line-height: 1.5; }
  .notice svg { flex: none; margin-top: 2px; }
  .notice-warn { background: var(--accent-soft); color: #5E3D00; }
  .notice-info { background: var(--info-soft); color: #1D4677; }
  .notice-danger { background: var(--danger-soft); color: #7D2416; }

  /* 모달 */
  .modal-back { position: fixed; inset: 0; background: rgba(18, 26, 23, .5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
  .modal {
    background: var(--surface); width: 100%; max-width: 720px; max-height: 92vh; overflow: auto;
    border-radius: 18px 18px 0 0; box-shadow: var(--shadow-lg); animation: up .2s ease-out;
  }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .modal-head h3 { margin: 0; font-size: 18px; flex: 1; letter-spacing: -.3px; }
  .modal-body { padding: 18px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
  @media (min-width: 720px) {
    .modal-back { align-items: center; padding: 24px; }
    .modal { border-radius: 18px; }
  }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 토스트 */
  .toast-wrap { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 80; pointer-events: none; padding: 0 16px; }
  .toast { background: #1D2926; color: #fff; padding: 11px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 14.5px; max-width: 520px; animation: up .2s ease-out; }
  .toast.err { background: var(--danger); }

  /* 로딩 */
  .spinner { width: 22px; height: 22px; border: 3px solid rgba(30,107,82,.2); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
  .btn .spinner { width: 16px; height: 16px; border-width: 2px; border-color: rgba(255,255,255,.35); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 48px 0; color: var(--muted); }

  /* 사진 자리 */
  .ph { width: 100%; height: 100%; background: linear-gradient(110deg, #EEEAE1 30%, #F6F3EC 50%, #EEEAE1 70%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .ph.noimg { animation: none; background: #EEEAE1; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 13px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* 정보 목록 */
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px 14px; margin: 0; }
  .kv dt { color: var(--muted); font-size: 14px; font-weight: 600; }
  .kv dd { margin: 0; font-weight: 600; }

  .foot { padding: 28px 0 40px; text-align: center; font-size: 13px; color: var(--faint); }
  .foot a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
